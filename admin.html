<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel — Halana Gadelha</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gold: #B8923A; --gold-light: #D4AA5A;
      --dark: #1A1611; --mid: #4A4037; --muted: #8A7B6E;
      --cream: #F9F5EF; --parchment: #F0E9DC; --white: #FDFAF6;
      --green: #2E7D52; --red: #9B2B2B; --blue: #1E4D8C;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--dark); font-weight: 300; min-height: 100vh; }

    /* ── LOGIN ── */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--dark); padding: 2rem;
    }
    .login-box {
      background: var(--white); padding: 3rem 2.5rem; width: 100%; max-width: 380px;
      border: 1px solid rgba(184,146,58,0.2); text-align: center;
    }
    .login-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 400; color: var(--dark); margin-bottom: 0.3rem; }
    .login-sub { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 2rem; }
    .login-label { display: block; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); text-align: left; margin-bottom: 6px; margin-top: 1.2rem; }
    .login-input {
      width: 100%; border: 1px solid rgba(184,146,58,0.3); background: var(--cream);
      padding: 0.8rem 1rem; font-family: 'Jost', sans-serif; font-size: 1rem; color: var(--dark);
      outline: none; transition: border-color 0.2s;
    }
    .login-input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; margin-top: 1.5rem; background: var(--gold); color: white; border: none;
      padding: 0.95rem; font-family: 'Jost', sans-serif; font-size: 0.8rem; letter-spacing: 0.18em;
      text-transform: uppercase; cursor: pointer; transition: background 0.2s;
    }
    .login-btn:hover { background: var(--dark); }
    .login-error { color: var(--red); font-size: 0.82rem; margin-top: 0.8rem; min-height: 1.2rem; }

    /* ── ADMIN SHELL ── */
    #adminShell { display: none; min-height: 100vh; flex-direction: column; }
    .admin-header {
      background: var(--dark); padding: 0 5vw; height: 62px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .admin-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; color: white; }
    .admin-logo span { font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-light); margin-left: 0.6rem; }
    .admin-actions { display: flex; gap: 0.8rem; align-items: center; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.55rem 1.1rem; font-family: 'Jost', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border: none; border-radius: 2px; transition: all 0.2s; font-weight: 400; }
    .btn-gold { background: var(--gold); color: white; }
    .btn-gold:hover { background: var(--gold-light); }
    .btn-outline-white { background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.2); }
    .btn-outline-white:hover { color: white; border-color: rgba(255,255,255,0.5); }
    .btn-green { background: var(--green); color: white; }
    .btn-green:hover { opacity: 0.85; }
    .btn-red { background: var(--red); color: white; }
    .btn-red:hover { opacity: 0.85; }
    .btn-blue { background: var(--blue); color: white; }
    .btn-blue:hover { opacity: 0.85; }
    .btn-gray { background: #ccc; color: var(--dark); }
    .btn-gray:hover { background: #bbb; }

    .admin-body { padding: 2rem 5vw; flex: 1; }

    /* ── STATS ── */
    .admin-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--white); border: 1px solid rgba(184,146,58,0.15); padding: 1.2rem 1.5rem; }
    .stat-card-num { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 400; color: var(--gold); }
    .stat-card-lbl { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

    /* ── PROPERTY LIST ── */
    .section-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .section-bar h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 400; }
    .prop-list { display: flex; flex-direction: column; gap: 1rem; }
    .prop-item {
      background: var(--white); border: 1px solid rgba(184,146,58,0.15);
      display: grid; grid-template-columns: 100px 1fr auto; gap: 1rem; align-items: center;
      padding: 1rem; transition: box-shadow 0.2s;
    }
    .prop-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); }
    .prop-item.sold { opacity: 0.65; }
    .prop-thumb { width: 100px; height: 72px; object-fit: cover; display: block; background: var(--parchment); flex-shrink: 0; }
    .prop-thumb-placeholder { width: 100px; height: 72px; background: var(--parchment); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
    .prop-info { min-width: 0; }
    .prop-name { font-size: 1rem; font-weight: 400; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prop-meta { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
    .prop-price { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--gold); margin-top: 4px; }
    .sold-badge { display: inline-block; background: var(--red); color: white; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 2px 7px; margin-left: 6px; vertical-align: middle; }
    .prop-btns { display: flex; flex-direction: column; gap: 0.4rem; flex-shrink: 0; }

    /* ── MODAL FORM ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(26,22,17,0.85); z-index: 200;
      display: flex; align-items: flex-start; justify-content: center; padding: 1rem;
      overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .form-modal {
      background: var(--white); width: 100%; max-width: 680px; margin: auto;
      padding: 2.5rem; position: relative;
      transform: translateY(16px); transition: transform 0.3s;
    }
    .overlay.open .form-modal { transform: translateY(0); }
    .form-modal-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 400; margin-bottom: 1.5rem; color: var(--dark); }
    .form-close { position: absolute; top: 1rem; right: 1rem; background: var(--dark); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-row.full { grid-template-columns: 1fr; }
    .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .field label { display: block; font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
    .field input, .field textarea, .field select {
      width: 100%; border: 1px solid rgba(184,146,58,0.25); background: var(--cream);
      padding: 0.7rem 0.9rem; font-family: 'Jost', sans-serif; font-size: 0.9rem;
      color: var(--dark); outline: none; transition: border-color 0.2s; appearance: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--gold); }
    .field textarea { min-height: 90px; resize: vertical; }

    /* Photos */
    .photos-section { margin-bottom: 1.2rem; }
    .photos-label { font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.7rem; display: block; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.6rem; margin-bottom: 0.8rem; }
    .photo-thumb-wrap { position: relative; aspect-ratio: 4/3; }
    .photo-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-remove { position: absolute; top: 3px; right: 3px; background: var(--red); color: white; border: none; width: 22px; height: 22px; border-radius: 50%; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .upload-btn-wrap { position: relative; display: inline-block; }
    .upload-btn { background: var(--parchment); border: 1px dashed var(--gold); color: var(--gold); padding: 0.6rem 1.2rem; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: background 0.2s; }
    .upload-btn:hover { background: rgba(184,146,58,0.1); }
    #photoInput { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* Features */
    .features-wrap { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.6rem; }
    .feat-chip { display: flex; align-items: center; gap: 5px; background: var(--parchment); border: 1px solid rgba(184,146,58,0.2); padding: 4px 10px; font-size: 0.78rem; }
    .feat-chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; padding: 0; line-height: 1; }
    .feat-add { display: flex; gap: 0.5rem; }
    .feat-add input { flex: 1; }

    .form-footer { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem; flex-wrap: wrap; }

    /* ── CONFIRM DIALOG ── */
    .confirm-overlay { position: fixed; inset: 0; background: rgba(26,22,17,0.9); z-index: 300; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .confirm-overlay.open { display: flex; }
    .confirm-box { background: var(--white); padding: 2rem; max-width: 360px; width: 100%; text-align: center; }
    .confirm-title { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; margin-bottom: 0.8rem; }
    .confirm-msg { font-size: 0.9rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem; }
    .confirm-btns { display: flex; gap: 0.8rem; justify-content: center; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark); color: white; padding: 0.8rem 1.6rem; font-size: 0.85rem; border-left: 3px solid var(--gold); z-index: 400; transition: transform 0.35s; white-space: nowrap; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--green); }
    .toast.error { border-color: var(--red); }

    /* ── VIEW SITE LINK ── */
    .view-site { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-decoration: none; letter-spacing: 0.08em; }
    .view-site:hover { color: var(--gold-light); }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 4rem; color: var(--muted); font-size: 0.9rem; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .prop-item { grid-template-columns: 80px 1fr; }
      .prop-btns { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
      .form-row { grid-template-columns: 1fr; }
      .form-row.three { grid-template-columns: 1fr 1fr; }
      .admin-actions .btn span { display: none; }
      .form-modal { padding: 1.5rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Halana Gadelha</div>
    <div class="login-sub">Painel de Administração</div>
    <label class="login-label">Senha</label>
    <input type="password" class="login-input" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ADMIN SHELL -->
<div id="adminShell">
  <header class="admin-header">
    <div class="admin-logo">Halana Gadelha <span>Painel Admin</span></div>
    <div class="admin-actions">
      <a class='view-site' href='/' target='_blank'>← Ver site</a>
      <button class="btn btn-gold" onclick="openForm()">＋ <span>Novo Imóvel</span></button>
      <div class="upload-btn-wrap" style="position:relative;display:inline-block">
        <button class="btn btn-outline-white">📥 <span>Importar</span><input type="file" accept=".json" onchange="importData(event)" style="position:absolute;inset:0;opacity:0;cursor:pointer"/></button>
      </div>
      <button class="btn btn-outline-white" onclick="exportData()">📤 <span>Baixar imoveis.json</span></button>
      <button class="btn btn-outline-white" onclick="doLogout()">Sair</button>
    </div>
  </header>

  <div class="admin-body">
    <!-- Stats -->
    <div class="admin-stats" id="adminStats"></div>

    <!-- List -->
    <div class="section-bar">
      <h2>Imóveis Cadastrados</h2>
    </div>
    <div class="prop-list" id="propList"></div>
  </div>
</div>

<!-- FORM MODAL -->
<div class="overlay" id="formOverlay">
  <div class="form-modal">
    <button class="form-close" onclick="closeForm()">✕</button>
    <div class="form-modal-title" id="formTitle">Novo Imóvel</div>

    <div class="photos-section">
      <span class="photos-label">📷 Fotos do Imóvel</span>
      <div class="photo-grid" id="photoGrid"></div>
      <div class="upload-btn-wrap">
        <div class="upload-btn">＋ Adicionar fotos
          <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotos(event)"/>
        </div>
      </div>
      <div style="font-size:0.72rem;color:var(--muted);margin-top:0.5rem;">Selecione quantas fotos quiser. Arraste para reordenar.</div>
    </div>

    <div class="form-row">
      <div class="field">
        <label>Nome do Imóvel *</label>
        <input type="text" id="fName" placeholder="Ex: Apartamento Boa Viagem"/>
      </div>
      <div class="field">
        <label>Preço *</label>
        <input type="text" id="fPrice" placeholder="Ex: R$ 950.000"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="field">
        <label>Endereço completo</label>
        <input type="text" id="fAddress" placeholder="Ex: Av. Boa Viagem, 1500 · Boa Viagem, Recife"/>
      </div>
    </div>
    <div class="form-row three">
      <div class="field">
        <label>Tipo</label>
        <select id="fType">
          <option value="apartamento">Apartamento</option>
          <option value="cobertura">Cobertura</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div class="field">
        <label>Etiqueta no card</label>
        <input type="text" id="fTag" placeholder="Ex: Apartamento, Lançamento"/>
      </div>
      <div class="field">
        <label>Andar / Posição</label>
        <input type="text" id="fFloor" placeholder="Ex: 8º andar"/>
      </div>
    </div>
    <div class="form-row three">
      <div class="field">
        <label>Área</label>
        <input type="text" id="fArea" placeholder="Ex: 120 m²"/>
      </div>
      <div class="field">
        <label>Quartos</label>
        <input type="text" id="fRooms" placeholder="Ex: 3 quartos"/>
      </div>
      <div class="field">
        <label>Banheiros</label>
        <input type="text" id="fBaths" placeholder="Ex: 2 banheiros"/>
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Vagas de garagem</label>
        <input type="text" id="fParking" placeholder="Ex: 2 vagas"/>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="fSold">
          <option value="false">Disponível</option>
          <option value="true">Vendido</option>
        </select>
      </div>
    </div>
    <div class="form-row full">
      <div class="field">
        <label>Descrição do imóvel</label>
        <textarea id="fDesc" placeholder="Descreva o imóvel com detalhes: localização, acabamento, diferenciais..."></textarea>
      </div>
    </div>

    <div class="photos-section">
      <span class="photos-label">✨ Diferenciais (opcional)</span>
      <div class="features-wrap" id="featureChips"></div>
      <div class="feat-add">
        <input type="text" class="field" id="featInput" placeholder="Ex: Piscina, Vista mar, Academia..." style="border:1px solid rgba(184,146,58,0.25);background:var(--cream);padding:0.6rem 0.9rem;font-family:'Jost',sans-serif;font-size:0.88rem;outline:none;" onkeydown="if(event.key==='Enter'){event.preventDefault();addFeature()}"/>
        <button class="btn btn-gold" onclick="addFeature()">Adicionar</button>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn btn-gray" onclick="closeForm()">Cancelar</button>
      <button class="btn btn-gold" onclick="saveProperty()" style="padding:0.7rem 2rem;">💾 Salvar Imóvel</button>
    </div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">Confirmar</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="btn btn-gray" onclick="closeConfirm()">Cancelar</button>
      <button class="btn btn-red" id="confirmOkBtn">Confirmar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════
   CONFIGURAÇÃO — mude a senha aqui!
   ══════════════════════════════════════════ */
const ADMIN_PASSWORD = 'halana2025';
const STORAGE_KEY = 'halana_imoveis_v1';

/* ── Auth ── */
function doLogin() {
  const pw = document.getElementById('loginPassword').value;
  if (pw === ADMIN_PASSWORD) {
    sessionStorage.setItem('hg_admin', '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminShell').style.display = 'flex';
    dataReady.then(renderAdmin);
  } else {
    document.getElementById('loginError').textContent = 'Senha incorreta. Tente novamente.';
    document.getElementById('loginPassword').value = '';
  }
}
function doLogout() {
  sessionStorage.removeItem('hg_admin');
  location.reload();
}
// Check session
if (sessionStorage.getItem('hg_admin')) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminShell').style.display = 'flex';
}

/* ── Data ── */
const DEFAULT_DATA = [
  { id:1, name:"Apartamento Vista Mar — Boa Viagem", address:"Av. Boa Viagem, 3200 · Boa Viagem, Recife", price:"R$ 1.290.000", type:"apartamento", tag:"Apartamento", area:"148 m²", rooms:"4 quartos", baths:"3 banheiros", parking:"2 vagas", floor:"12º andar", sold:false, desc:"Apartamento sofisticado a 200m da praia de Boa Viagem, com varanda frente mar, acabamento premium e cozinha gourmet integrada.", features:["Vista mar","Varanda gourmet","Suíte master","Closet","Academia","Piscina","Segurança 24h"], media:[{type:"image",src:"https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800&q=80"},{type:"image",src:"https://images.unsplash.com/photo-1484154218962-a197022b5858?w=800&q=80"}] },
  { id:2, name:"Cobertura Duplex Pina", address:"Rua Sólon de Lucena, 210 · Pina, Recife", price:"R$ 2.400.000", type:"cobertura", tag:"Cobertura", area:"280 m²", rooms:"4 suítes", baths:"5 banheiros", parking:"4 vagas", floor:"Cobertura Duplex", sold:false, desc:"Cobertura duplex exclusiva no bairro do Pina, com terraço panorâmico e piscina privativa de borda infinita.", features:["Piscina privativa","Terraço panorâmico","Pé direito duplo","Cozinha gourmet","Smart home"], media:[{type:"image",src:"https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=800&q=80"}] },
  { id:3, name:"Apartamento Setúbal Gardens", address:"Rua João Eugênio, 780 · Setúbal, Recife", price:"R$ 890.000", type:"apartamento", tag:"Apartamento", area:"130 m²", rooms:"3 quartos", baths:"2 banheiros", parking:"2 vagas", floor:"8º andar", sold:true, desc:"Apartamento moderno e bem localizado no bairro de Setúbal.", features:["Varanda gourmet","Piscina","Academia","Portaria 24h"], media:[{type:"image",src:"https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=800&q=80"}] },
  { id:4, name:"Apartamento Novo — Ilha do Leite", address:"Rua Real da Torre, 520 · Ilha do Leite, Recife", price:"R$ 980.000", type:"apartamento", tag:"Lançamento", area:"118 m²", rooms:"3 quartos", baths:"2 banheiros", parking:"2 vagas", floor:"15º andar", sold:false, desc:"Apartamento novo em prédio de alto padrão na Ilha do Leite.", features:["Rooftop","Coworking","Piscina","Bicicletário"], media:[{type:"image",src:"https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=800&q=80"}] }
];

async function loadInitialData() {
  try {
    const response = await fetch('imoveis.json', { cache: 'no-store' });
    if (response.ok) return await response.json();
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch(e) {
    showToast('Não foi possível salvar. Remova algumas fotos ou use imagens menores.', 'error');
    return false;
  }
}
async function initData() {
  if (!localStorage.getItem(STORAGE_KEY)) saveData(await loadInitialData());
}
const dataReady = initData();

/* ── Render admin ── */
function renderAdmin() {
  const props = loadData();
  // Stats
  const total = props.length, available = props.filter(p=>!p.sold).length, sold = props.filter(p=>p.sold).length;
  document.getElementById('adminStats').innerHTML = `
    <div class="stat-card"><div class="stat-card-num">${total}</div><div class="stat-card-lbl">Total de Imóveis</div></div>
    <div class="stat-card"><div class="stat-card-num" style="color:var(--green)">${available}</div><div class="stat-card-lbl">Disponíveis</div></div>
    <div class="stat-card"><div class="stat-card-num" style="color:var(--red)">${sold}</div><div class="stat-card-lbl">Vendidos</div></div>`;
  // List
  if (!props.length) {
    document.getElementById('propList').innerHTML = '<div class="empty">Nenhum imóvel cadastrado ainda.<br>Clique em "+ Novo Imóvel" para começar.</div>';
    return;
  }
  document.getElementById('propList').innerHTML = props.map(p => {
    const thumb = p.media && p.media[0];
    const imgEl = thumb ? `<img class="prop-thumb" src="${thumb.src}" alt="${p.name}"/>` : `<div class="prop-thumb-placeholder">🏢</div>`;
    return `<div class="prop-item ${p.sold?'sold':''}">
      ${imgEl}
      <div class="prop-info">
        <div class="prop-name">${p.name}${p.sold?'<span class="sold-badge">Vendido</span>':''}</div>
        <div class="prop-meta">${p.address} · ${p.area} · ${p.rooms}</div>
        <div class="prop-price">${p.price}</div>
      </div>
      <div class="prop-btns">
        <button class="btn btn-blue" onclick="openForm(${p.id})">✏️ <span>Editar</span></button>
        ${p.sold
          ? `<button class="btn btn-green" onclick="toggleSold(${p.id})">✅ <span>Disponível</span></button>`
          : `<button class="btn btn-red" style="background:#9B2B2B" onclick="toggleSold(${p.id})">🏷️ <span>Marcar Vendido</span></button>`}
        <button class="btn btn-gray" onclick="confirmDelete(${p.id})">🗑️ <span>Remover</span></button>
      </div>
    </div>`;
  }).join('');
}

/* ── Form state ── */
let editingId = null;
let currentPhotos = []; // [{src: string, isNew: bool}]
let currentFeatures = [];

function openForm(id) {
  editingId = id || null;
  currentPhotos = [];
  currentFeatures = [];
  const props = loadData();
  if (id) {
    const p = props.find(x => x.id === id);
    if (!p) return;
    document.getElementById('formTitle').textContent = 'Editar Imóvel';
    document.getElementById('fName').value = p.name;
    document.getElementById('fPrice').value = p.price;
    document.getElementById('fAddress').value = p.address;
    document.getElementById('fType').value = p.type;
    document.getElementById('fTag').value = p.tag;
    document.getElementById('fFloor').value = p.floor;
    document.getElementById('fArea').value = p.area;
    document.getElementById('fRooms').value = p.rooms;
    document.getElementById('fBaths').value = p.baths;
    document.getElementById('fParking').value = p.parking;
    document.getElementById('fSold').value = String(p.sold);
    document.getElementById('fDesc').value = p.desc;
    currentPhotos = (p.media || []).map(m => ({src: m.src, isNew: false}));
    currentFeatures = [...(p.features || [])];
  } else {
    document.getElementById('formTitle').textContent = 'Novo Imóvel';
    ['fName','fPrice','fAddress','fTag','fFloor','fArea','fRooms','fBaths','fParking','fDesc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fType').value = 'apartamento';
    document.getElementById('fSold').value = 'false';
  }
  renderPhotoGrid();
  renderFeatureChips();
  document.getElementById('formOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeForm() {
  document.getElementById('formOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── Photos ── */
async function handlePhotos(e) {
  const files = Array.from(e.target.files);
  let loaded = 0;
  for (const file of files) {
    try {
      const src = await compressImage(file);
      currentPhotos.push({src, isNew: true});
      loaded++;
      if (loaded === files.length) renderPhotoGrid();
    } catch(e) {
      showToast('Não foi possível carregar uma das fotos.', 'error');
    }
  }
  e.target.value = '';
}
function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) {
      reject(new Error('Arquivo inválido'));
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxSide = 1600;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function removePhoto(i) {
  currentPhotos.splice(i, 1);
  renderPhotoGrid();
}
function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  if (!currentPhotos.length) { grid.innerHTML = ''; return; }
  grid.innerHTML = currentPhotos.map((p, i) =>
    `<div class="photo-thumb-wrap">
      <img src="${p.src}" alt="foto ${i+1}"/>
      <button class="photo-remove" onclick="removePhoto(${i})">✕</button>
    </div>`
  ).join('');
}

/* ── Features ── */
function addFeature() {
  const inp = document.getElementById('featInput');
  const val = inp.value.trim();
  if (!val) return;
  val.split(',').forEach(v => { const t = v.trim(); if (t) currentFeatures.push(t); });
  inp.value = '';
  renderFeatureChips();
}
function removeFeature(i) { currentFeatures.splice(i, 1); renderFeatureChips(); }
function renderFeatureChips() {
  document.getElementById('featureChips').innerHTML = currentFeatures.map((f, i) =>
    `<div class="feat-chip">${f}<button onclick="removeFeature(${i})">✕</button></div>`
  ).join('');
}

/* ── Save ── */
function saveProperty() {
  const name = document.getElementById('fName').value.trim();
  const price = document.getElementById('fPrice').value.trim();
  if (!name || !price) { showToast('Preencha pelo menos o nome e o preço.', 'error'); return; }
  const props = loadData();
  const media = currentPhotos.map(p => ({type:'image', src:p.src}));
  const newProp = {
    id: editingId || (Date.now()),
    name, price,
    address: document.getElementById('fAddress').value.trim(),
    type: document.getElementById('fType').value,
    tag: document.getElementById('fTag').value.trim() || document.getElementById('fType').value.charAt(0).toUpperCase() + document.getElementById('fType').value.slice(1),
    floor: document.getElementById('fFloor').value.trim(),
    area: document.getElementById('fArea').value.trim(),
    rooms: document.getElementById('fRooms').value.trim(),
    baths: document.getElementById('fBaths').value.trim(),
    parking: document.getElementById('fParking').value.trim(),
    sold: document.getElementById('fSold').value === 'true',
    desc: document.getElementById('fDesc').value.trim(),
    features: currentFeatures,
    media
  };
  if (editingId) {
    const idx = props.findIndex(p => p.id === editingId);
    if (idx >= 0) props[idx] = newProp; else props.push(newProp);
  } else {
    props.push(newProp);
  }
  if (!saveData(props)) return;
  closeForm();
  renderAdmin();
  showToast(editingId ? 'Imóvel atualizado com sucesso!' : 'Novo imóvel adicionado!', 'success');
}

/* ── Toggle sold ── */
function toggleSold(id) {
  const props = loadData();
  const p = props.find(x => x.id === id);
  if (!p) return;
  p.sold = !p.sold;
  if (!saveData(props)) return;
  renderAdmin();
  showToast(p.sold ? '🏷️ Imóvel marcado como vendido.' : '✅ Imóvel marcado como disponível.', 'success');
}

/* ── Delete ── */
let pendingDeleteId = null;
function confirmDelete(id) {
  const props = loadData();
  const p = props.find(x => x.id === id);
  if (!p) return;
  pendingDeleteId = id;
  document.getElementById('confirmTitle').textContent = 'Remover Imóvel';
  document.getElementById('confirmMsg').textContent = `Tem certeza que deseja remover "${p.name}"? Esta ação não pode ser desfeita.`;
  document.getElementById('confirmOkBtn').textContent = 'Sim, remover';
  document.getElementById('confirmOverlay').classList.add('open');
}
document.getElementById('confirmOkBtn').addEventListener('click', () => {
  if (pendingDeleteId == null) return;
  const props = loadData().filter(p => p.id !== pendingDeleteId);
  if (!saveData(props)) return;
  closeConfirm();
  renderAdmin();
  showToast('Imóvel removido.', 'success');
  pendingDeleteId = null;
});
function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('open'); }

/* ── Toast ── */
let toastTimer;
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeForm(); closeConfirm(); }
});


/* ── Export/Import ── */
function exportData() {
  const data = loadData();
  // Build a self-contained snippet to update index.html would be complex
  // Instead: export as JSON backup
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'imoveis.json';
  a.click();
  showToast('Arquivo imoveis.json baixado com sucesso!', 'success');
}
function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error('Formato inválido');
      if (!saveData(data)) return;
      renderAdmin();
      showToast('Dados importados com sucesso!', 'success');
    } catch(err) {
      showToast('Erro ao importar. Verifique o arquivo.', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ── Init ── */
if (sessionStorage.getItem('hg_admin')) dataReady.then(renderAdmin);
document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
